<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" />
<title>VeilPilot</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="shell">

  <header id="rail">
    <span id="mark" aria-hidden="true"></span>
    <h1 id="wordmark">VeilPilot</h1>
    <button id="veilState" class="state" type="button" title="Toggle capture protection">
      <span class="dot"></span><span class="label">invisible</span>
    </button>
    <button id="recState" class="state rec" type="button" title="Start / stop transcribe">
      <span class="dot"></span><span class="label">idle</span>
    </button>
    <button id="gear" class="chrome" type="button">settings</button>
  </header>

  <main id="readout" tabindex="-1">
    <div id="legend">
      <p class="legendLead">Nothing asked yet. Press a key.</p>
      <dl id="legendKeys"></dl>
      <p class="legendFoot" id="legendFoot"></p>
    </div>
    <div id="cards"></div>
  </main>

  <section id="drawer" class="collapsed">
    <button id="drawerHead" type="button">
      <span class="label">transcript</span>
      <span id="drawerCount" class="count">empty</span>
      <span id="drawerChevron" class="chevron" aria-hidden="true"></span>
    </button>
    <div id="transcript"></div>
  </section>

  <footer id="composer">
    <div id="shots"></div>
    <div id="inputRow">
      <span class="caret" aria-hidden="true">&rsaquo;</span>
      <textarea id="input" rows="1" placeholder="ask anything" spellcheck="false"></textarea>
      <kbd id="sendHint">&crarr;</kbd>
    </div>
  </footer>

  <div id="grip" title="Drag to resize"></div>
  <div id="toasts" aria-live="polite"></div>

  <!-- Settings replaces the panel body rather than floating over it: the
       window is too small for a modal to leave anything useful behind. -->
  <div id="settings" hidden>
    <header id="settingsRail">
      <h2>Settings</h2>
      <nav id="tabs">
        <button class="tab is-on" data-tab="ai" type="button">AI</button>
        <button class="tab" data-tab="voice" type="button">Voice</button>
        <button class="tab" data-tab="shots" type="button">Capture</button>
        <button class="tab" data-tab="prompts" type="button">Prompts</button>
        <button class="tab" data-tab="keys" type="button">Keys</button>
      </nav>
      <button id="settingsClose" class="chrome" type="button">done</button>
    </header>
    <div id="settingsBody"></div>
  </div>

</div>

<script src="markdown.js"></script>
<script src="recorder.js"></script>
<script src="settings.js"></script>
<script src="app.js"></script>
</body>
</html>
