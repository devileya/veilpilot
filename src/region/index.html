<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self'" />
<title>Select a region</title>
<style>
  :root {
    --lamp: #e8a33d;
    --read: #f2ede4;
    --void: #15131c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    cursor: crosshair;
    background: var(--void);
    font: 400 12px/1 "SF Compact Text", "Bahnschrift", "Segoe UI Variable Text", system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }

  #frame {
    position: absolute;
    inset: 0;
    background-size: 100% 100%;
    background-repeat: no-repeat;
  }

  /* Dimming lives in the selection's own outer shadow, so the selected area
     stays at full brightness with no second element to keep in sync. */
  #veil {
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 0 9999px rgba(21, 19, 28, 0.58);
    pointer-events: none;
  }

  #sel {
    position: absolute;
    display: none;
    border: 1px solid var(--lamp);
    box-shadow: 0 0 0 9999px rgba(21, 19, 28, 0.58);
    pointer-events: none;
  }
  #sel::before, #sel::after {
    content: "";
    position: absolute;
    width: 9px; height: 9px;
    border: 1px solid var(--lamp);
  }
  #sel::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  #sel::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

  #size {
    position: absolute;
    display: none;
    padding: 3px 7px;
    background: var(--void);
    color: var(--lamp);
    border: 1px solid rgba(232, 163, 61, 0.45);
    font-family: "SF Mono", "Cascadia Mono", ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    pointer-events: none;
    white-space: nowrap;
  }

  #hint {
    position: absolute;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    padding: 9px 16px;
    color: var(--read);
    background: rgba(21, 19, 28, 0.9);
    border: 1px solid rgba(242, 237, 228, 0.14);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 10.5px;
  }
  #hint b { color: var(--lamp); font-weight: 500; }
</style>
</head>
<body>
  <div id="frame"></div>
  <div id="veil"></div>
  <div id="sel"></div>
  <div id="size"></div>
  <div id="hint">Drag to select &nbsp;·&nbsp; <b>Esc</b> cancels</div>
  <script src="region.js"></script>
</body>
</html>
